<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TechQuote Pro - Cotizador de Cómputo</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- React & ReactDOM & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: 'var(--brand-color, #2563eb)',
            'brand-dark': 'var(--brand-dark-color, #1d4ed8)',
            'brand-light': 'var(--brand-light-color, #eff6ff)',
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --brand-color: #2563eb;
      --brand-dark-color: #1d4ed8;
      --brand-light-color: #eff6ff;
    }

    body {
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      background-color: #f8fafc;
    }

    /* Ocultar barra de desplazamiento manteniendo funcionalidad */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Animaciones táctiles estilo Android */
    .active-scale {
      transition: transform 0.1s ease;
    }
    .active-scale:active {
      transform: scale(0.96);
    }

    /* Estilos exclusivos para impresión PDF / A4 */
    @media print {
      body * {
        visibility: hidden;
      }
      #print-modal-container, #print-modal-container * {
        visibility: visible;
      }
      #print-modal-container {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        margin: 0;
        padding: 0;
        background: white !important;
      }
      .no-print {
        display: none !important;
      }
      .print-shadow-none {
        box-shadow: none !important;
        border: none !important;
      }
      @page {
        size: A4;
        margin: 12mm;
      }
    }

    /* Control de color de fondo dinamico */
    .dynamic-bg-brand {
      background-color: var(--brand-color);
    }
    .dynamic-text-brand {
      color: var(--brand-color);
    }
    .dynamic-border-brand {
      border-color: var(--brand-color);
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col justify-between selection:bg-blue-200">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- DATOS POR DEFECTO ---
    const DEFAULT_SETTINGS = {
      companyName: '',
      companyRuc: '',
      companyAddress: '',
      companyPhone: '',
      companyEmail: '',
      companyWeb: '',
      companyLogo: '',
      currency: 'S/',
      taxName: 'IGV',
      taxRate: 18,
      taxIncluded: true,
      paymentMethods: "• Banco BCP: 191-XXXXXXX-0-XX (CCI: 002-191-XXXXXXX)\n• Yape / Plin: 987-654-321\n• BBVA: 0011-XXXX-XXXXXXXX\n• Transferencia / Efectivo",
      themeColor: '#2563eb',
      defaultNotes: "• Garantía de hardware: 12 meses por defectos de fábrica.\n• Precios expresados en la moneda indicada e incluyen IGV.\n• Tiempo de entrega: Inmediato / 24 hrs previa recepción de pago.\n• Validez de la cotización: 7 días calendario."
    };

    const INITIAL_PRODUCTS = [
      { id: 'p1', name: 'Procesador Intel Core i7-13700K 3.4GHz 16-Core', category: 'Procesadores', sku: 'PROC-INT-13700K', price: 1650.00, specs: '16 Núcleos, Socket LGA1700, 30MB Cache' },
      { id: 'p2', name: 'Tarjeta de Video NVIDIA RTX 4070 Super 12GB GDDR6X', category: 'Tarjetas Gráficas', sku: 'GPU-NV-4070S', price: 2950.00, specs: '12GB GDDR6X, DLSS 3.5, Ray Tracing' },
      { id: 'p3', name: 'Memoria RAM Corsair Vengeance DDR5 32GB (2x16GB) 6000MHz', category: 'RAM', sku: 'RAM-COR-32D5', price: 520.00, specs: 'DDR5 6000MHz CL36 Expo/XMP 3.0' },
      { id: 'p4', name: 'SSD M.2 NVMe Kingston KC3000 1TB PCIe 4.0', category: 'Almacenamiento', sku: 'SSD-KNG-1TB', price: 380.00, specs: 'Lectura hasta 7000 MB/s, Escritura 6000 MB/s' },
      { id: 'p5', name: 'Placa Madre ASUS TUF Gaming B760-Plus WiFi DDR5', category: 'Placas Madre', sku: 'MB-ASU-B760', price: 820.00, specs: 'LGA1700, PCIe 5.0, WiFi 6E, Bluetooth 5.3' }
    ];

    const INITIAL_CLIENTS = [
      { id: 'c1', name: 'Innova Solutions S.A.C.', ruc: '20601234567', phone: '987654321', email: 'compras@innovasolutions.pe', address: 'Av. Javier Prado Este 1420, Of. 502, Lima' },
      { id: 'c2', name: 'Carlos Mendoza Ríos', ruc: '10458912341', phone: '912345678', email: 'carlos.mendoza@gmail.com', address: 'Ca. Los Pinos 340, Miraflores' }
    ];

    const CATEGORIES = [
      'Procesadores', 'Tarjetas Gráficas', 'RAM', 'Almacenamiento', 
      'Placas Madre', 'Laptops', 'Periféricos', 'Fuentes y Cases', 'Otros'
    ];

    const PALETTE_COLORS = [
      '#2563eb', // Azul
      '#059669', // Verde Esmeralda
      '#7c3aed', // Púrpura
      '#d97706', // Ámbar / Naranja
      '#e11d48', // Rojo Rosa
      '#0f172a'  // Oscuro Grafito
    ];

    function App() {
      // --- ESTADOS PRINCIPALES ---
      const [activeTab, setActiveTab] = useState('cotizar'); // 'cotizar', 'productos', 'clientes', 'ajustes'
      const [settings, setSettings] = useState(() => {
        const saved = localStorage.getItem('techquote_settings');
        return saved ? JSON.parse(saved) : DEFAULT_SETTINGS;
      });
      const [products, setProducts] = useState(() => {
        const saved = localStorage.getItem('techquote_products');
        return saved ? JSON.parse(saved) : INITIAL_PRODUCTS;
      });
      const [clients, setClients] = useState(() => {
        const saved = localStorage.getItem('techquote_clients');
        return saved ? JSON.parse(saved) : INITIAL_CLIENTS;
      });
      const [quoteHistory, setQuoteHistory] = useState(() => {
        const saved = localStorage.getItem('techquote_history');
        return saved ? JSON.parse(saved) : [];
      });

      // --- ESTADO DE COTIZACIÓN ACTUAL ---
      const [currentQuote, setCurrentQuote] = useState({
        number: `COT-${String(Math.floor(Math.random() * 900) + 100).padStart(4, '0')}`,
        date: new Date().toISOString().split('T')[0],
        validUntil: new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
        clientId: '',
        customClient: { name: '', ruc: '', phone: '', email: '', address: '' },
        items: [],
        notes: settings.defaultNotes || ''
      });

      // --- ESTADOS DE MÓDALES Y NOTIFICACIONES ---
      const [toast, setToast] = useState(null);
      const [productModal, setProductModal] = useState({ open: false, item: null });
      const [clientModal, setClientModal] = useState({ open: false, item: null });
      const [addProductModal, setAddProductModal] = useState(false);
      const [customItemModal, setCustomItemModal] = useState(false);
      const [previewModal, setPreviewModal] = useState(false);
      const [historyModal, setHistoryModal] = useState(false);

      // Persistencia en LocalStorage
      useEffect(() => {
        localStorage.setItem('techquote_settings', JSON.stringify(settings));
        // Actualizar variables de CSS para el tema
        document.documentElement.style.setProperty('--brand-color', settings.themeColor || '#2563eb');
        document.documentElement.style.setProperty('--brand-dark-color', adjustColor(settings.themeColor || '#2563eb', -20));
      }, [settings]);

      useEffect(() => {
        localStorage.setItem('techquote_products', JSON.stringify(products));
      }, [products]);

      useEffect(() => {
        localStorage.setItem('techquote_clients', JSON.stringify(clients));
      }, [clients]);

      useEffect(() => {
        localStorage.setItem('techquote_history', JSON.stringify(quoteHistory));
      }, [quoteHistory]);

      // Función auxiliar para oscurecer el color hex del tema
      function adjustColor(color, amount) {
        return '#' + color.replace(/^#/, '').match(/.{2}/g).map(x => 
          Math.min(255, Math.max(0, parseInt(x, 16) + amount)).toString(16).padStart(2, '0')
        ).join('');
      }

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3000);
      };

      // --- MANEJO DE IMÁGENES / LOGO ---
      const handleLogoUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          if (file.size > 2 * 1024 * 1024) {
            showToast('El logo debe pesar menos de 2MB', 'error');
            return;
          }
          const reader = new FileReader();
          reader.onloadend = () => {
            setSettings(prev => ({ ...prev, companyLogo: reader.result }));
            showToast('Logo actualizado correctamente');
          };
          reader.readAsDataURL(file);
        }
      };

      // --- CÁLCULOS MATEMÁTICOS DE COTIZACIÓN ---
      const calculateTotals = () => {
        const itemsTotal = currentQuote.items.reduce((acc, item) => {
          const sub = item.price * item.qty;
          const disc = sub * ((item.discount || 0) / 100);
          return acc + (sub - disc);
        }, 0);

        const rate = parseFloat(settings.taxRate) || 0;
        let subtotal = 0;
        let taxAmount = 0;
        let grandTotal = 0;

        if (settings.taxIncluded) {
          grandTotal = itemsTotal;
          subtotal = grandTotal / (1 + rate / 100);
          taxAmount = grandTotal - subtotal;
        } else {
          subtotal = itemsTotal;
          taxAmount = subtotal * (rate / 100);
          grandTotal = subtotal + taxAmount;
        }

        return {
          subtotal: subtotal.toFixed(2),
          taxAmount: taxAmount.toFixed(2),
          grandTotal: grandTotal.toFixed(2),
          itemsTotal: itemsTotal.toFixed(2)
        };
      };

      const totals = calculateTotals();

      // --- MANEJO DE ITEMS DE COTIZACIÓN ---
      const addItemToQuote = (prod) => {
        const existingIndex = currentQuote.items.findIndex(i => i.prodId === prod.id);
        if (existingIndex >= 0) {
          const updated = [...currentQuote.items];
          updated[existingIndex].qty += 1;
          setCurrentQuote({ ...currentQuote, items: updated });
        } else {
          setCurrentQuote({
            ...currentQuote,
            items: [
              ...currentQuote.items,
              {
                id: Date.now().toString(),
                prodId: prod.id,
                name: prod.name,
                sku: prod.sku,
                price: prod.price,
                qty: 1,
                discount: 0,
                specs: prod.specs || ''
              }
            ]
          });
        }
        showToast(`Agregado: ${prod.name}`);
        setAddProductModal(false);
      };

      const addCustomItemToQuote = (customItem) => {
        setCurrentQuote({
          ...currentQuote,
          items: [
            ...currentQuote.items,
            {
              id: Date.now().toString(),
              name: customItem.name,
              sku: customItem.sku || 'SERV-LIBRE',
              price: parseFloat(customItem.price) || 0,
              qty: parseInt(customItem.qty) || 1,
              discount: parseFloat(customItem.discount) || 0,
              specs: customItem.specs || ''
            }
          ]
        });
        showToast('Ítem personalizado agregado');
        setCustomItemModal(false);
      };

      const updateQuoteItem = (id, field, value) => {
        const updated = currentQuote.items.map(item => {
          if (item.id === id) {
            return { ...item, [field]: value };
          }
          return item;
        });
        setCurrentQuote({ ...currentQuote, items: updated });
      };

      const removeQuoteItem = (id) => {
        setCurrentQuote({
          ...currentQuote,
          items: currentQuote.items.filter(i => i.id !== id)
        });
        showToast('Producto eliminado de la cotización');
      };

      // --- GUARDAR EN HISTORIAL ---
      const saveQuoteToHistory = () => {
        if (currentQuote.items.length === 0) {
          showToast('Agrega al menos un producto a la cotización', 'error');
          return;
        }

        const selectedClientObj = clients.find(c => c.id === currentQuote.clientId) || currentQuote.customClient;
        const newEntry = {
          ...currentQuote,
          id: Date.now().toString(),
          savedAt: new Date().toLocaleString(),
          clientData: selectedClientObj,
          totals: totals,
          currency: settings.currency
        };

        setQuoteHistory([newEntry, ...quoteHistory]);
        showToast('Cotización guardada en el historial');
      };

      // --- COPIAR A WHATSAPP ---
      const copyWhatsAppSummary = () => {
        const clientObj = clients.find(c => c.id === currentQuote.clientId) || currentQuote.customClient;
        const clientName = clientObj.name || 'Cliente';
        
        let text = `*COTIZACIÓN ${currentQuote.number}*\n`;
        text += `🏢 *${settings.companyName || 'TechQuote Pro'}*\n`;
        text += `👤 *Cliente:* ${clientName}\n`;
        text += `📅 *Fecha:* ${currentQuote.date}\n`;
        text += `------------------------------------\n`;
        
        currentQuote.items.forEach((item, idx) => {
          const itemTotal = (item.price * item.qty * (1 - (item.discount || 0)/100)).toFixed(2);
          text += `${idx + 1}. *${item.name}*\n`;
          text += `   Cant: ${item.qty} x ${settings.currency} ${item.price.toFixed(2)} = *${settings.currency} ${itemTotal}*\n`;
        });

        text += `------------------------------------\n`;
        text += `*TOTAL A PAGAR: ${settings.currency} ${totals.grandTotal}*\n`;
        if (settings.taxIncluded) text += `_(Incluye ${settings.taxName} ${settings.taxRate}%)_\n`;
        text += `\n💳 *Métodos de Pago:*\n${settings.paymentMethods.split('\n')[0]}\n`;
        text += `\n💬 *Notas:* ${currentQuote.notes.substring(0, 100)}...`;

        // Copiar usando textarea temporal para compatibilidad iframe
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand('copy');
          showToast('¡Resumen de Cotización copiado! Listo para pegar en WhatsApp');
        } catch (err) {
          showToast('Error al copiar al portapapeles', 'error');
        }
        document.body.removeChild(textarea);
      };

      // Verificar si los datos de la empresa están completos
      const isCompanyConfigured = Boolean(settings.companyName && settings.companyRuc && settings.companyPhone);

      return (
        <div className="flex flex-col min-h-screen bg-slate-100 max-w-md mx-auto relative shadow-2xl overflow-hidden border-x border-slate-200">

          {/* ALERTA DE TOAST */}
          {toast && (
            <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-50 px-4 py-3 rounded-xl shadow-xl text-white font-medium text-sm flex items-center space-x-2 transition-all duration-300 max-w-xs w-full ${toast.type === 'error' ? 'bg-red-600' : 'bg-slate-800'}`}>
              <i className={`fas ${toast.type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle'} text-lg`}></i>
              <span className="flex-1">{toast.message}</span>
            </div>
          )}

          {/* CABECERA APP MATERIAL 3 */}
          <header className="bg-slate-900 text-white p-4 sticky top-0 z-30 shadow-md flex items-center justify-between" style={{ backgroundColor: 'var(--brand-color)' }}>
            <div className="flex items-center space-x-3">
              {settings.companyLogo ? (
                <img src={settings.companyLogo} alt="Logo" className="w-9 h-9 object-contain rounded-lg bg-white p-0.5 shadow-sm" />
              ) : (
                <div className="w-9 h-9 rounded-lg bg-white/20 flex items-center justify-center font-bold text-lg">
                  <i className="fas fa-desktop"></i>
                </div>
              )}
              <div>
                <h1 className="font-bold text-lg leading-tight tracking-tight">
                  {settings.companyName || 'TechQuote Pro'}
                </h1>
                <p className="text-xs text-white/80 font-medium">Cotizador de Cómputo</p>
              </div>
            </div>

            <div className="flex items-center space-x-2">
              <button 
                onClick={() => setHistoryModal(true)}
                className="w-9 h-9 rounded-full bg-white/15 hover:bg-white/25 flex items-center justify-center text-white active-scale transition-colors"
                title="Historial de Cotizaciones">
                <i className="fas fa-history text-sm"></i>
              </button>
            </div>
          </header>

          {/* BANNER REQUISITO DE CONFIGURACIÓN */}
          {!isCompanyConfigured && activeTab !== 'ajustes' && (
            <div className="bg-amber-50 border-b border-amber-200 p-3 px-4 flex items-center justify-between text-xs text-amber-900">
              <div className="flex items-center space-x-2">
                <i className="fas fa-exclamation-triangle text-amber-600 text-sm"></i>
                <span>Ingresa los datos de tu empresa para tus documentos.</span>
              </div>
              <button 
                onClick={() => setActiveTab('ajustes')}
                className="bg-amber-600 text-white font-semibold px-2.5 py-1 rounded-lg text-[11px] shadow-sm hover:bg-amber-700 active-scale">
                Configurar
              </button>
            </div>
          )}

          {/* CONTENIDO PRINCIPAL SEGÚN LA PESTAÑA */}
          <main className="flex-1 overflow-y-auto p-4 pb-24 space-y-4">

            {/* ===================== PESTAÑA 1: COTIZAR ===================== */}
            {activeTab === 'cotizar' && (
              <div className="space-y-4 animate-fade-in">
                
                {/* TARJETA DATOS CABECERA DE COTIZACIÓN */}
                <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80 space-y-3">
                  <div className="flex items-center justify-between border-b border-slate-100 pb-2">
                    <span className="text-xs font-bold uppercase tracking-wider text-slate-400">Datos de la Cotización</span>
                    <span className="text-xs font-bold px-2.5 py-0.5 rounded-full bg-blue-50 text-blue-700 border border-blue-100">
                      N° {currentQuote.number}
                    </span>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-[11px] font-semibold text-slate-500 block mb-1">Fecha Emisión</label>
                      <input 
                        type="date" 
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-medium focus:ring-2 focus:ring-blue-500 outline-none"
                        value={currentQuote.date}
                        onChange={(e) => setCurrentQuote({ ...currentQuote, date: e.target.value })}
                      />
                    </div>
                    <div>
                      <label className="text-[11px] font-semibold text-slate-500 block mb-1">Validez Hasta</label>
                      <input 
                        type="date" 
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-medium focus:ring-2 focus:ring-blue-500 outline-none"
                        value={currentQuote.validUntil}
                        onChange={(e) => setCurrentQuote({ ...currentQuote, validUntil: e.target.value })}
                      />
                    </div>
                  </div>

                  {/* SELECCIÓN DE CLIENTE */}
                  <div>
                    <div className="flex justify-between items-center mb-1">
                      <label className="text-[11px] font-semibold text-slate-500">Cliente</label>
                      <button 
                        onClick={() => setClientModal({ open: true, item: null })}
                        className="text-[11px] font-bold text-blue-600 hover:underline flex items-center space-x-1">
                        <i className="fas fa-plus-circle"></i>
                        <span>Nuevo Cliente</span>
                      </button>
                    </div>
                    <select 
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-medium text-slate-700 focus:ring-2 focus:ring-blue-500 outline-none"
                      value={currentQuote.clientId}
                      onChange={(e) => setCurrentQuote({ ...currentQuote, clientId: e.target.value })}
                    >
                      <option value="">-- Seleccionar de Clientes Registrados --</option>
                      {clients.map(c => (
                        <option key={c.id} value={c.id}>{c.name} ({c.ruc})</option>
                      ))}
                    </select>
                  </div>

                  {/* SI NO TIENE CLIENTE REGISTRADO SELECCIONADO, INGRESO RÁPIDO */}
                  {!currentQuote.clientId && (
                    <div className="pt-2 border-t border-dashed border-slate-200 grid grid-cols-2 gap-2">
                      <input 
                        type="text" 
                        placeholder="Nombre / Razón Social *"
                        className="col-span-2 bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5 text-xs outline-none focus:bg-white"
                        value={currentQuote.customClient.name}
                        onChange={(e) => setCurrentQuote({
                          ...currentQuote,
                          customClient: { ...currentQuote.customClient, name: e.target.value }
                        })}
                      />
                      <input 
                        type="text" 
                        placeholder="RUC / DNI"
                        className="bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5 text-xs outline-none focus:bg-white"
                        value={currentQuote.customClient.ruc}
                        onChange={(e) => setCurrentQuote({
                          ...currentQuote,
                          customClient: { ...currentQuote.customClient, ruc: e.target.value }
                        })}
                      />
                      <input 
                        type="text" 
                        placeholder="Teléfono / WhatsApp"
                        className="bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5 text-xs outline-none focus:bg-white"
                        value={currentQuote.customClient.phone}
                        onChange={(e) => setCurrentQuote({
                          ...currentQuote,
                          customClient: { ...currentQuote.customClient, phone: e.target.value }
                        })}
                      />
                    </div>
                  )}
                </div>

                {/* BOTONES AGREGAR PRODUCTOS */}
                <div className="grid grid-cols-2 gap-2">
                  <button 
                    onClick={() => setAddProductModal(true)}
                    className="bg-slate-800 text-white font-semibold p-3 rounded-2xl shadow-sm text-xs flex items-center justify-center space-x-2 active-scale hover:bg-slate-900">
                    <i className="fas fa-search text-blue-400"></i>
                    <span>Buscar Catálogo</span>
                  </button>
                  <button 
                    onClick={() => setCustomItemModal(true)}
                    className="bg-white border border-slate-300 text-slate-700 font-semibold p-3 rounded-2xl shadow-sm text-xs flex items-center justify-center space-x-2 active-scale hover:bg-slate-50">
                    <i className="fas fa-plus text-slate-500"></i>
                    <span>Ítem / Servicio Libre</span>
                  </button>
                </div>

                {/* LISTA DE ÍTEMS EN LA COTIZACIÓN */}
                <div className="space-y-3">
                  <div className="flex items-center justify-between px-1">
                    <h3 className="text-xs font-bold uppercase tracking-wider text-slate-500">
                      Productos Seleccionados ({currentQuote.items.length})
                    </h3>
                    {currentQuote.items.length > 0 && (
                      <button 
                        onClick={() => setCurrentQuote({ ...currentQuote, items: [] })}
                        className="text-[11px] font-semibold text-red-500 hover:underline">
                        Vaciar lista
                      </button>
                    )}
                  </div>

                  {currentQuote.items.length === 0 ? (

              <input 
                type="text" 
                placeholder="Ej. Computadoras Lima S.A.C."
                className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs outline-none"
                value={form.name}
                onChange={(e) => setForm({ ...form, name: e.target.value })}
              />
            </div>

            <div className="grid grid-cols-2 gap-2">
              <div>
                <label className="text-[11px] font-semibold text-slate-500 block mb-1">RUC / DNI</label>
                <input 
                  type="text" 
                  placeholder="20987654321"
                  className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs outline-none"
                  value={form.ruc}
                  onChange={(e) => setForm({ ...form, ruc: e.target.value })}
                />
              </div>
              <div>
                <label className="text-[11px] font-semibold text-slate-500 block mb-1">Teléfono</label>
                <input 
                  type="text" 
                  placeholder="987654321"
                  className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs outline-none"
                  value={form.phone}
                  onChange={(e) => setForm({ ...form, phone: e.target.value })}
                />
              </div>
            </div>

            <div>
              <label className="text-[11px] font-semibold text-slate-500 block mb-1">Correo Electrónico</label>
              <input 
                type="email" 
                placeholder="contacto@cliente.com"
                className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs outline-none"
                value={form.email}
                onChange={(e) => setForm({ ...form, email: e.target.value })}
              />
            </div>

            <div>
              <label className="text-[11px] font-semibold text-slate-500 block mb-1">Dirección Física</label>
              <input 
                type="text" 
                placeholder="Av. Principal 123, Oficina 201"
                className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs outline-none"
                value={form.address}
                onChange={(e) => setForm({ ...form, address: e.target.value })}
              />
            </div>

            <button 
              onClick={() => {
                if(!form.name) return alert('Ingresa el nombre del cliente');
                onSave(form);
              }}
              className="w-full bg-slate-900 text-white font-bold py-3 rounded-xl text-xs active-scale">
              Guardar Cliente
            </button>
          </div>
        </div>
      );
    }

    // Renderizar App en el DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
